<!-- Vlad Landing System: Split Hero -->
<section class="vls-hero-split" aria-labelledby="vls-hero-title">
  <style>
    .vls-hero-split {
      --vls-bg: #f7f8fa;
      --vls-text: #111318;
      --vls-muted: #666c78;
      --vls-border: #e5e7eb;
      --vls-primary: #111827;
      --vls-primary-hover: #1f2937;
      --vls-on-primary: #fff;
      --vls-radius: 24px;
      --vls-container: 1200px;

      padding: 72px 16px;
      color: var(--vls-text);
      background: var(--vls-bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .vls-hero-split * { box-sizing: border-box; }

    .vls-hero-split__inner {
      width: min(100%, var(--vls-container));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(380px, .95fr);
      gap: 56px;
      align-items: center;
    }

    .vls-hero-split__eyebrow {
      margin: 0 0 16px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--vls-muted);
    }

    .vls-hero-split__title {
      max-width: 760px;
      margin: 0;
      font-size: clamp(40px, 5vw, 64px);
      line-height: 1.02;
      letter-spacing: -.035em;
      font-weight: 750;
    }

    .vls-hero-split__lead {
      max-width: 680px;
      margin: 24px 0 0;
      font-size: 19px;
      line-height: 1.55;
      color: var(--vls-muted);
    }

    .vls-hero-split__proofs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      padding: 0;
      margin: 28px 0 0;
      list-style: none;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 600;
    }

    .vls-hero-split__proofs li {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .vls-hero-split__proofs svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .vls-hero-split__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .vls-hero-split__button {
      min-height: 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 26px;
      border: 1px solid var(--vls-primary);
      border-radius: 14px;
      font-size: 16px;
      line-height: 1;
      font-weight: 700;
      text-decoration: none;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .vls-hero-split__button--primary {
      color: var(--vls-on-primary);
      background: var(--vls-primary);
    }

    .vls-hero-split__button--primary:hover { background: var(--vls-primary-hover); }

    .vls-hero-split__button--secondary {
      color: var(--vls-text);
      background: transparent;
      border-color: var(--vls-border);
    }

    .vls-hero-split__button:active { transform: translateY(1px); }
    .vls-hero-split__button:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }

    .vls-hero-split__media {
      min-height: 520px;
      overflow: hidden;
      border: 1px solid var(--vls-border);
      border-radius: var(--vls-radius);
      background: #fff;
    }

    .vls-hero-split__media img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 520px;
      object-fit: cover;
    }

    @media (max-width: 920px) {
      .vls-hero-split { padding: 56px 20px; }
      .vls-hero-split__inner { grid-template-columns: 1fr; gap: 36px; }
      .vls-hero-split__media,
      .vls-hero-split__media img { min-height: 420px; }
    }

    @media (max-width: 767px) {
      .vls-hero-split { padding: 44px 16px; }
      .vls-hero-split__title { font-size: clamp(36px, 11vw, 46px); }
      .vls-hero-split__lead { margin-top: 18px; font-size: 17px; }
      .vls-hero-split__proofs { margin-top: 22px; display: grid; gap: 10px; }
      .vls-hero-split__actions { display: grid; margin-top: 26px; }
      .vls-hero-split__button { width: 100%; }
      .vls-hero-split__media,
      .vls-hero-split__media img { min-height: 340px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .vls-hero-split__button { transition: none; }
    }
  </style>

  <div class="vls-hero-split__inner">
    <div class="vls-hero-split__content">
      <p class="vls-hero-split__eyebrow">Контекст / категория</p>
      <h1 class="vls-hero-split__title" id="vls-hero-title">Главный оффер страницы без абстрактного слогана</h1>
      <p class="vls-hero-split__lead">Короткое пояснение: что получает пользователь, какие важные условия действуют и почему стоит перейти к следующему шагу.</p>

      <ul class="vls-hero-split__proofs" aria-label="Ключевые преимущества">
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          Подтверждённое преимущество
        </li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          Подтверждённый факт
        </li>
      </ul>

      <div class="vls-hero-split__actions">
        <a class="vls-hero-split__button vls-hero-split__button--primary" href="#popup:call">Главное действие</a>
        <a class="vls-hero-split__button vls-hero-split__button--secondary" href="#details">Узнать подробнее</a>
      </div>
    </div>

    <div class="vls-hero-split__media">
      <img src="https://placehold.co/900x1100" alt="Замените на смысловое изображение проекта">
    </div>
  </div>
</section>
